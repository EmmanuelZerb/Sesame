<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sésame — Wallet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" crossorigin="anonymous" />
<style>
  :root {
    --bg-primary: #0A0A0F;
    --bg-elev: #11111A;
    --bg-card: rgba(255,255,255,0.05);
    --bg-glass: rgba(255,255,255,0.08);
    --border-subtle: rgba(255,255,255,0.1);
    --border-strong: rgba(255,255,255,0.18);
    --accent-primary: #6C63FF;
    --accent-secondary: #FF6584;
    --accent-gold: #FFD166;
    --text-primary: #F0F0F5;
    --text-secondary: rgba(240,240,245,0.55);
    --text-tertiary: rgba(240,240,245,0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: #050507;
    color: var(--text-primary);
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1200px 600px at 20% 10%, rgba(108,99,255,0.12), transparent 60%),
      radial-gradient(900px 500px at 85% 90%, rgba(255,101,132,0.08), transparent 60%),
      #050507;
    padding: 24px;
  }

  /* Phone frame */
  .phone {
    position: relative;
    width: 100%;
    max-width: 430px;
    height: min(932px, calc(100vh - 48px));
    border-radius: 48px;
    background: var(--bg-primary);
    box-shadow:
      0 0 0 12px #1a1a22,
      0 0 0 13px #2a2a35,
      0 40px 120px rgba(0,0,0,0.7),
      0 0 80px rgba(108,99,255,0.1);
    overflow: hidden;
    isolation: isolate;
  }

  .phone::before {
    /* Grain overlay */
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 50;
    opacity: 0.035;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.8'/></svg>");
    mix-blend-mode: overlay;
  }

  /* Dynamic island */
  .island {
    position: absolute;
    top: 10px; left: 50%;
    transform: translateX(-50%);
    width: 115px; height: 34px;
    background: #000;
    border-radius: 20px;
    z-index: 40;
  }

  /* Status bar */
  .status-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 34px 0;
    font-family: 'Sora';
    font-weight: 600;
    font-size: 15px;
    z-index: 30;
    color: var(--text-primary);
  }

  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* Base typography */
  h1, h2, h3, h4 { font-family: 'Sora'; font-weight: 600; letter-spacing: -0.02em; }
  .mono { font-family: 'JetBrains Mono'; }

  /* App container */
  #app { width: 100%; height: 100%; position: relative; }

  /* Scrollbars */
  .scroll::-webkit-scrollbar { display: none; }
  .scroll { scrollbar-width: none; -ms-overflow-style: none; }

  /* Shimmer */
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* Haptic pulse */
  @keyframes hapticPulse {
    0% { transform: scale(1); }
    40% { transform: scale(0.96); }
    100% { transform: scale(1); }
  }
  .pulse { animation: hapticPulse 0.35s cubic-bezier(0.34, 1.56, 0.64, 1); }

  /* Slide in from bottom */
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  /* Tweaks panel */
  .tweaks-panel {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 280px;
    background: rgba(17,17,26,0.95);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid var(--border-strong);
    border-radius: 20px;
    padding: 18px;
    z-index: 1000;
    font-family: 'DM Sans';
    font-size: 13px;
    color: var(--text-primary);
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: none;
  }
  .tweaks-panel.visible { display: block; animation: fadeInUp 0.3s ease; }
  .tweaks-panel h4 {
    font-family: 'Sora';
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 14px;
  }
  .tweaks-panel label { display: block; margin-bottom: 14px; }
  .tweaks-panel label span { display: block; margin-bottom: 6px; color: var(--text-secondary); font-size: 12px; }
  .tweaks-panel select, .tweaks-panel input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border-subtle);
    color: var(--text-primary);
    padding: 8px 10px;
    border-radius: 10px;
    font-family: inherit;
    font-size: 13px;
    outline: none;
  }
  .tweaks-panel select:focus, .tweaks-panel input:focus { border-color: var(--accent-primary); }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; }
  .swatch {
    width: 28px; height: 28px;
    border-radius: 8px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.active { border-color: #fff; }

</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="phone" id="phone">
    <div class="island"></div>
    <div class="status-bar" id="status-bar">
      <span>9:41</span>
      <div class="status-icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="none"><path d="M1 8.5C3.5 6 6 5 9 5s5.5 1 8 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="9" cy="10" r="1.5" fill="currentColor"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><rect x="1" y="3" width="11" height="7" rx="2" stroke="currentColor" stroke-width="1.3"/><rect x="3" y="5" width="7" height="3" rx="0.5" fill="currentColor"/><rect x="13" y="5" width="1.5" height="3" rx="0.5" fill="currentColor"/></svg>
      </div>
    </div>
    <div id="app"></div>
  </div>

  <div class="tweaks-panel" id="tweaks">
    <h4>Tweaks</h4>
    <label>
      <span>Accent color</span>
      <div class="swatches" id="accent-swatches"></div>
    </label>
    <label>
      <span>Greeting style</span>
      <select id="greeting-style">
        <option value="time">Time-based (Good evening)</option>
        <option value="short">Short (Hey)</option>
        <option value="vault">Sésame mode (Welcome back)</option>
      </select>
    </label>
    <label>
      <span>Card style</span>
      <select id="card-style">
        <option value="gradient">Gradient (default)</option>
        <option value="mono">Monochrome</option>
        <option value="embossed">Embossed foil</option>
      </select>
    </label>
    <label>
      <span>User name</span>
      <input type="text" id="user-name" />
    </label>
  </div>

  <script>
    // Tweaks state + protocol
    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "accent": "#60A5FA",
      "greetingStyle": "time",
      "cardStyle": "embossed",
      "userName": "Alex"
    }/*EDITMODE-END*/;

    window.__vault = { tweaks: { ...TWEAK_DEFAULTS }, listeners: [] };
    window.__vault.subscribe = (fn) => { window.__vault.listeners.push(fn); return () => { window.__vault.listeners = window.__vault.listeners.filter(l => l !== fn); }; };
    window.__vault.setTweaks = (patch) => {
      window.__vault.tweaks = { ...window.__vault.tweaks, ...patch };
      document.documentElement.style.setProperty('--accent-primary', window.__vault.tweaks.accent);
      window.__vault.listeners.forEach(fn => fn(window.__vault.tweaks));
      try {
        window.parent.postMessage({ type: '__edit_mode_set_keys', edits: patch }, '*');
      } catch(e) {}
    };

    // Initialize accent
    document.documentElement.style.setProperty('--accent-primary', TWEAK_DEFAULTS.accent);

    // Edit mode wiring
    const tweaksPanel = document.getElementById('tweaks');
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') tweaksPanel.classList.add('visible');
      if (e.data?.type === '__deactivate_edit_mode') tweaksPanel.classList.remove('visible');
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    // Build swatches
    const ACCENTS = ['#6C63FF', '#FFD166', '#FF6584', '#34D399', '#60A5FA', '#F472B6'];
    const swatchesEl = document.getElementById('accent-swatches');
    const renderSwatches = () => {
      swatchesEl.innerHTML = '';
      ACCENTS.forEach(c => {
        const b = document.createElement('div');
        b.className = 'swatch' + (window.__vault.tweaks.accent === c ? ' active' : '');
        b.style.background = c;
        b.onclick = () => { window.__vault.setTweaks({ accent: c }); renderSwatches(); };
        swatchesEl.appendChild(b);
      });
    };
    renderSwatches();

    const gs = document.getElementById('greeting-style');
    gs.value = TWEAK_DEFAULTS.greetingStyle;
    gs.onchange = (e) => window.__vault.setTweaks({ greetingStyle: e.target.value });

    const cs = document.getElementById('card-style');
    cs.value = TWEAK_DEFAULTS.cardStyle;
    cs.onchange = (e) => window.__vault.setTweaks({ cardStyle: e.target.value });

    const un = document.getElementById('user-name');
    un.value = TWEAK_DEFAULTS.userName;
    un.oninput = (e) => window.__vault.setTweaks({ userName: e.target.value });
  </script>

  <script type="text/babel" data-presets="react" src="vault-icons.jsx"></script>
  <script type="text/babel" data-presets="react" src="vault-data.jsx"></script>
  <script type="text/babel" data-presets="react" src="vault-components.jsx"></script>
  <script type="text/babel" data-presets="react" src="vault-screens.jsx"></script>
  <script type="text/babel" data-presets="react" src="vault-app.jsx"></script>
</body>
</html>
